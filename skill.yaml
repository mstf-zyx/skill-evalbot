# Evalbot Skill
# 直接调用 Evalbot HTTP API，无需 MCP 协议封装

name: evalbot
version: 1.0.0
description: 直接调用 Evalbot HTTP API，支持数据生成和模型评估

entrypoint: python evalbot_skill.py

env:
  - name: EVALBOT_TOKEN
    description: Evalbot 授权 Token
    required: false

commands:
  - name: data-generation
    description: 生成数据（如热点话题）
    args:
      - name: generate_type
        description: 生成数据类型，目前仅支持 hot_topic
        type: string
        default: hot_topic
      - name: top_n
        description: 获取前 N 个热点话题
        type: integer
        default: 5

  - name: model-evaluation
    description: 评估模型回复质量
    args:
      - name: evaluate_type
        description: |
          评估类型，支持：
          - knowledge-instruction_following: 指令遵循评估
          - knowledge-scalable-comprehensive_key_points: 综合要点评估
          - knowledge-authentic_and_accurate-general: 真实准确性评估
          - knowledge-richness: 丰富度评估
          - knowledge-gsb-compare: GSB 对比评估
        type: string
        required: true
      - name: params
        description: 评估参数（JSON 格式字符串）
        type: string
        required: true
